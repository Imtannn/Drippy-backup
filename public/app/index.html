<html>
	<head>
		<title>App 2</title>

		<base href="/app/index.html" />

		<script src="../write-html.js" href="/"></script>
	</head>

	<body>
		<style>
			/* Hide the #root we're not using from the imported HTML. */
			#root:first-of-type {
				display: none;
			}

			body {
				overflow: auto;
				pointer-events: auto;
			}

			login-ui {
				pointer-events: auto;
				display: block;
				position: absolute;
				top: 10px;
				right: 10px;
				z-index: 2;
			}
		</style>

		<login-ui
			custom-style="
				#loginButtons a.login-link-text {
					color: black;

					:host-context([data-theme='dark']) & {
						color: white;
					}
				}
			"
		></login-ui>

		<div class="theme-switch-container">
			<theme-switch></theme-switch>
		</div>

		<!-- <back-button></back-button> -->
		<!-- <button class="logo-button">Logo</button> -->
		<style>
			.theme-switch-container {
				position: absolute;
				top: 30px;
				right: 1.5rem;
				z-index: 1;
				width: 2rem;
				height: 2rem;
				display: flex;
				align-items: center;
				justify-content: center;
				border-radius: 9999px;
				border: none;
			}

			theme-switch {
				--theme-switch-icon-color: rgb(29, 29, 29);

				[data-theme='dark'] & {
					--theme-switch-icon-color: rgb(219, 219, 219);
				}
			}

			back-button {
				position: absolute;
				top: 30px;
				left: 1.5rem;
				z-index: 1;
				transform: translateX(0);
			}

			.logo-button {
				position: absolute;
				top: 75px;
				right: 1.5rem;
				z-index: 1;
				background-color: #121316;
				width: 2rem;
				height: 2rem;
				font-size: 8px;
				display: flex;
				font-weight: 600;
				align-items: center;
				justify-content: center;
				border-radius: 9999px;
				border: none;
				cursor: pointer;
				user-select: none;
				pointer-events: auto;
				will-change: background-color;
			}

			@media (min-width: 768px) {
				back-button {
					transform: translateX(24rem);
				}
			}
		</style>

		<drippy-app></drippy-app>
		<style>
			drippy-app {
				width: 100%;
				height: 100%;
			}
		</style>

		<script type="module" src="./app.js"></script>
	</body>
</html>
