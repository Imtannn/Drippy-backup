<html>
	<head>
		<title>Onboarding Register</title>

		<base href="/onboarding/index.html" />

		<script src="../write-html.js" href="/"></script>
	</head>

	<body>
		<style>
			/* Hide the #root we're not using from the imported HTML. */
			#root:first-of-type {
				display: none;
			}

			body {
				overflow: auto;
				pointer-events: auto;
			}

			login-ui {
				pointer-events: auto;
				display: block;
				position: absolute;
				top: 10px;
				right: 10px;
				z-index: 2;
			}

			#onboardingUI {
				padding: 20px;
				overflow-x: auto;
			}
		</style>

		<login-ui
			custom-style="
				#loginButtons a.login-link-text {
					color: black;

					:host-context([data-theme='dark']) & {
						color: white;
					}
				}
			"
		></login-ui>

		<theme-switch></theme-switch>
		<style>
			theme-switch {
				position: absolute;
				top: 30px;
				right: 10px;
				z-index: 1;

				--theme-switch-icon-color: rgb(29, 29, 29);

				[data-theme='dark'] & {
					--theme-switch-icon-color: rgb(219, 219, 219);
				}
			}
		</style>

		<script type="module" src="../routes.js"></script>
		<script type="module" src="../elements/theme-switch.js"></script>
		<script type="module" src="../elements/login-ui.js"></script>
		<script type="module" src="./OnboardingFlow.js"></script>

		<script>
			// Hide the loading cover
			const loadingCover = document.getElementById('loadingCover')
			if (loadingCover) {
				loadingCover.classList.add('invisible')
				loadingCover.addEventListener('transitionend', () => loadingCover.remove())
			}
		</script>

		<onboarding-flow step="1"></onboarding-flow>
	</body>
</html>
